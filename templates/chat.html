{% load static %}

{% block dependencies %}
    <script src="{% static 'js/panel_chat.js' %}"></script>
{% endblock dependencies %}

<div class="p-3">

    <div class="card-body d-flex flex-column">
        <div class="p-3">

            <!-- buscar chats por el correo del usuario -->
            <div class="input-group mb-3">
                <input type="text" class="form-control" placeholder="Ej: corredorxxx@nuam.com" id="buscador_chat">
                <button class="btn btn-outline-secondary" type="button" id="buscar_usuario">
                    <i class="bi bi-search"></i>
                </button>
            </div>

            <!-- Resultados de búsqueda, sino hay coincidencia no muestra nada  -->
            <div id="resultados_busqueda" class="mb-3" style="display:none;">
                <div class="list-group" id="lista_resultados"></div>
            </div>

            <!-- listado de contactos segun el rol -->
            <div class="accordion mb-3" id="acordeonContactos">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#contactosCollapse">
                            Contactos
                        </button>
                    </h2>

                    <div id="contactosCollapse" class="accordion-collapse collapse">
                        <div class="accordion-body p-0">

                            <!-- generación de los contactos segun el rol -->
                            <ul class="list-group list-group-flush" id="lista_contactos">

                                {% for c in contactos %}
                                    <li class="list-group-item selector-chat" data-correo="{{ c.email }}">
                                        {{ c.nombre }} ({{ c.email }})
                                    </li>
                                {% empty %}
                                    <li class="list-group-item text-muted"> No tiene contactos disponibles</li>
                                {% endfor %}
                                
                            </ul>

                        </div>
                    </div>
                </div>
            </div>

            <!-- listado de chats creados -->
            <div class="accordion" id="acordeonPrivado">
                <div class="accordion-item">
                    
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#privadoCollapse">
                            Privado
                        </button>
                    </h2>

                    <div id="privadoCollapse" class="accordion-collapse collapse">
                        <div class="accordion-body p-0">

                            <!-- lista con todos los chat_privado donde participe el usuario -->
                            <ul class="list-group list-group-flush" id="lista_chat_privado"></ul>

                        </div>
                    </div>

                </div>
            </div>

            <!-- panel de chat hay que probarlo y ver si funciona-->
            
            <div id="panel_chat" class="mt-3" style="display:none;">
                <div class="card shadow-sm p-2">
                    <div class="card-body d-flex flex-column">

                        <!-- nombre del chat -->
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 id="titulo_chat" class="m-0"></h5>

                            <button class="btn btn-sm btn-outline-secondary" id="cerrar_chat">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>

                        <!-- historial de conversación -->
                        <div id="zona_mensajes"
                            class="flex-grow-1 overflow-auto border rounded p-2"
                            style="background:#f8f9fa; min-height: 350px;">
                        </div>

                        <!-- redactar y enviar el mensaje -->
                        <form class="mt-2 d-flex">
                            <input type="text" class="form-control form-control-lg me-2" placeholder="Escribe un mensaje" id="entrada_mensaje">
                            <button class="btn btn-primary btn-lg" type="button" id="enviar_mensaje">Enviar</button>
                        </form>

                    </div>

                </div>

            </div>

        </div>
    </div>

</div>
