{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="{% static 'css/bootstrap.css'%}">
  <link rel="stylesheet" href="{% static 'css/_variables.scss'%}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block dependencies %}
  {% endblock dependencies %}
  <title>nuam | {% block title%}{% endblock title %}</title>
</head>

<body>

  <header>
    {% block navbar %}
    <nav class="navbar bg-nuam-nav border-bottom">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <div class="row">
                <div class="col-lg-4">
                    <img src="{% static 'img/logo.png' %}" alt="Logo" width="117" height="27"> |
                </div>
                {% block navbar_title %}
                <div class="ms-5 mt-1 col-lg-2 market-info">
                    <span class="mt-4">
                        MSCI NUAM USD
                        </br>
                        1.371 0.71% ▲
                    </span>
                </div>
                {% endblock navbar_title %}
            </div>
        </a>
        <div class="justify-content-end">
            <div class="profile-icon1">
                <i class="bi bi-person-circle"></i>
            </div>
        </div>
      </div>
    </nav>
    {% endblock navbar %}
  </header>

  {% block content %}{% endblock content %}
</body>

</html>
